# Project-wide Gradle settings.
# Heap sizes are bounded on purpose (this machine also runs emulators and Docker):
# measured peak with these values: AGENTS.md → "Build, test, publish".
# The daemon runs on JDK 21 (gradle/gradle-daemon-jvm.properties); a JDK outside the usual
# places: org.gradle.java.installations.paths in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 makes R8 drop the implied no-arg constructor for `-keep class X` rules
# without members. The pinned libraries' consumer rules predate that, so keep the
# AGP 8 meaning (no change to what release builds keep).
android.r8.strictFullModeForKeepRules=false

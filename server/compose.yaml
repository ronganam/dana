# Self-hosting Dana with Docker Compose (docs/operations.md, "Running it").
#
#   cp .env.example .env            # fill in the LLM key and API_TOKEN (both required)
#   docker compose up -d            # http://localhost:8080 (this machine only, see ports below)
#   docker compose --profile money up -d   # also the bank-worker sidecar (docs/money.md)
#
# Everything Dana writes (database, recordings, uploads, snapshots) lives in the `data` volume.
name: dana

services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_PATH: /app/db/db.sqlite3
    ports:
      # Only this machine can reach Dana. To reach it from elsewhere, put it behind a reverse proxy
      # with TLS (Caddy, Traefik, nginx…) on the same host, or change this to "8080:8080" on a network
      # you trust. API_TOKEN is required either way (docs/operations.md, "Running it").
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # The money addon's bank syncs: shares the app's network (Dana reaches it on 127.0.0.1:8090)
  # and only the money/ folder of the data, which money-dir creates first.
  money-dir:
    profiles: [money]
    image: dana-bank-worker
    build: ./bank-worker
    command: ["mkdir", "-p", "/data/money/profiles"]
    volumes:
      - data:/data
    depends_on: [app]   # the app creates the volume first, owned by its user
    restart: "no"
  bank-worker:
    profiles: [money]
    image: dana-bank-worker
    network_mode: "service:app"
    environment:
      TZ: ${TIMEZONE:-UTC}   # the server's zone (from .env): the dates the sites are asked for
    volumes:
      - type: volume
        source: data
        target: /app/db/money
        volume:
          subpath: money
    depends_on:
      app:
        condition: service_started
      money-dir:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  data:

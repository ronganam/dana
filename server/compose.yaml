# Self-hosting Dana with Docker Compose (docs/operations.md, "Running it").
#
#   cp .env.example .env            # fill in the LLM key
#   docker compose up -d            # http://localhost:8080 (this machine only, see ports below)
#   docker compose logs app | grep setup   # open the setup link to create your admin account
#   docker compose --profile money_il up -d   # also money_il's worker: the Israeli bank syncs, once the
#                                             # money_il addon is installed from the catalog
#
# An addon's worker (docs/operations.md, "Workers") runs as a service under a profile named after the
# addon. A catalog addon's worker runs the image its repository publishes, pinned to the commit you
# installed (set its tag in .env; `latest` follows the addon's main branch).
#
# Everything Dana writes (database, recordings, uploads, snapshots) lives in the `data` volume.
name: dana

services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DATABASE_PATH: /app/db/db.sqlite3
    ports:
      # Only this machine can reach Dana. To reach it from elsewhere, put it behind a reverse proxy
      # with TLS (Caddy, Traefik, nginx…) on the same host, or change this to "8080:8080" on a network
      # you trust (docs/operations.md, "Running it"); set PUBLIC_URL to the address phones use.
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # The money_il addon's worker (github.com/ronganam/dana-addon-money-il): shares the app's network (Dana
  # reaches it on 127.0.0.1:8090, MONEY_WORKER_URL) and only the money/ folder of the data, which
  # money-il-dir creates first. MONEY_IL_WORKER_TAG: the commit of money_il you installed.
  money-il-dir:
    profiles: [money_il]
    image: ghcr.io/ronganam/dana-addon-money-il-worker:${MONEY_IL_WORKER_TAG:-latest}
    command: ["mkdir", "-p", "/data/money/profiles"]
    volumes:
      - data:/data
    depends_on: [app]   # the app creates the volume first, owned by its user
    restart: "no"
  money-il-worker:
    profiles: [money_il]
    image: ghcr.io/ronganam/dana-addon-money-il-worker:${MONEY_IL_WORKER_TAG:-latest}
    network_mode: "service:app"
    environment:
      TZ: ${TIMEZONE:-UTC}   # the server's zone (from .env): the dates the sites are asked for
    volumes:
      - type: volume
        source: data
        target: /app/db/money
        volume:
          subpath: money
    depends_on:
      app:
        condition: service_started
      money-il-dir:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  data:

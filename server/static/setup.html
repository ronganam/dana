<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#2b2521" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f3ede1" media="(prefers-color-scheme: light)">
    <script>try { var dt = localStorage.getItem("dana_theme"); if (dt === "light" || dt === "dark") document.documentElement.dataset.theme = dt; } catch (e) {}</script>
    <title>Set up · Dana</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/kit.css">
    <link rel="stylesheet" href="/static/devices.css">
    <link rel="stylesheet" href="/static/zones.css">
    <link rel="stylesheet" href="/static/llm.css">
    <style>
        html, body { height: auto; min-height: 100%; }
        .setup { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .setup-card { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
        .setup-kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .7px; text-transform: uppercase; color: var(--accent-text); }
        .setup-title { font-family: var(--font-serif); font-weight: 400; font-size: 38px; line-height: 1.1; color: var(--ink); margin: 0; }
        .setup-lede { color: var(--body); font-size: 15px; margin: 0; }
        .setup-steps { display: flex; gap: 6px; }
        .setup-steps span { flex: 1; height: 3px; border-radius: var(--radius-full); background: var(--hairline-strong); }
        .setup-steps span.on { background: var(--accent); }
        .setup-form { display: flex; flex-direction: column; gap: 12px; }
        .setup-form .btn-primary { align-self: flex-start; padding: 9px 20px; }
        .setup-error { color: var(--rose-text); background: var(--rose-tint); border-radius: var(--radius-md); padding: 8px 12px; font-size: 13.5px; }
        .setup-error:empty { display: none; }
        .setup-note { color: var(--mute); font-size: 13px; margin: 0; }
        .setup-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
        .setup-actions .btn-primary, .setup-actions .btn-secondary { padding: 9px 20px; }
        .setup-actions [data-skip] { margin-inline-start: auto; }
        .setup-addon { display: flex; gap: 10px; align-items: flex-start; color: var(--body-strong); font-size: 14px; }
        .setup-addon input { margin-top: 3px; }
        .setup-pair { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .setup-pair:empty { display: none; }
    </style>
    <script src="/static/vendor/lucide.min.js" defer></script>
    <script src="/static/vendor/qrcode.js" defer></script>
    <script src="/static/devices.js" defer></script>
    <script src="/static/zones.js" defer></script>
    <script src="/static/llm.js" defer></script>
    <script src="/static/setup.js" defer></script>
</head>
<body>
    <main class="setup">
        <section class="setup-card" id="setup" aria-live="polite">
            <p class="setup-note">Loading…</p>
        </section>
    </main>
</body>
</html>

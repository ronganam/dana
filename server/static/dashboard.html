<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dana — Dashboard</title>
    <meta name="theme-color" content="#2b2622">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="preload" href="/static/vendor/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/static/vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <!-- Main Content -->
    <div class="dash-main">
        <!-- Camera Panel -->
        <div class="cam-slot">
            <div class="cam-panel">
                <div class="cam-viewport" id="cam-viewport">
                    <div class="cam-loading" id="cam-loading">
                        <div class="spinner-sm"></div>
                        <span>Connecting to camera&hellip;</span>
                    </div>
                    <video id="cam-video" autoplay muted playsinline></video>
                    <div class="cam-overlay">
                        <span class="cam-label"><i data-lucide="video"></i> PTZ</span>
                        <span class="cam-live connecting" id="cam-live-badge"><span class="live-dot"></span><span id="cam-badge-text">CONNECTING</span></span>
                    </div>
                    <!-- Time since the dog last moved (Frigate dog/bark events) -->
                    <span class="cam-lastmove" id="cam-lastmove" hidden></span>
                    <div class="cam-frozen-overlay" id="cam-frozen-overlay">
                        <i data-lucide="triangle-alert"></i>
                        <span>Stream frozen &mdash; reconnecting&hellip;</span>
                        <button id="cam-retry-btn">Retry now</button>
                    </div>
                </div>
            </div>
            <!-- Last 6 h of dog activity (Frigate detections, per 2 min), newest on the right -->
            <div class="motion-strip" id="motion-strip" aria-label="Dog activity, last 6 hours"><canvas id="motion-canvas"></canvas></div>
        </div>

        <!-- Frigate events rail: latest detections with GIF + relative age -->
        <aside class="events-rail" id="events-rail" aria-label="Recent camera events">
            <div class="events-title">Events</div>
            <div class="events-list" id="events-list"></div>
        </aside>

        <!-- Right Sidebar -->
        <div class="dash-sidebar">
            <!-- Clock & Controls Card -->
            <div class="dash-card clock-card">
                <div class="clock-main">
                    <span class="clock-date" id="clock-date"></span>
                    <span class="clock-time" id="clock-time"></span>
                </div>
                <!-- Only inside the Dana Kiosk app (window.DanaKiosk); opens the native assistant sheet. -->
                <button id="ask-dana" class="ask-dana" title="Ask Dana" hidden><i data-lucide="mic"></i></button>
                <div class="controls-col">
                    <div class="controls-row">
                        <div class="ctrl-group">
                            <button id="zoom-out" title="Zoom page out">&minus;</button>
                            <span class="ctrl-label" id="zoom-label">100%</span>
                            <button id="zoom-in" title="Zoom page in">+</button>
                        </div>
                    </div>
                    <div class="controls-row">
                        <div class="ctrl-group">
                            <button id="cam-zoom-out" title="Zoom camera out"><i data-lucide="minus"></i></button>
                            <span class="ctrl-label" id="cam-zoom-label">100%</span>
                            <button id="cam-zoom-in" title="Zoom camera in"><i data-lucide="plus"></i></button>
                            <button id="cam-zoom-reset" title="Reset camera zoom"><i data-lucide="maximize-2"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Climate Card -->
            <div class="dash-card climate-card">
                <div class="card-body climate-body">
                    <div class="climate-main">
                        <div class="climate-current">
                            <span class="cur-temp" id="cur-temp">--</span>
                        </div>
                        <div class="climate-target">
                            <div class="temp-control">
                                <button class="temp-btn" id="temp-down" title="Lower target">&minus;</button>
                                <span class="temp-value" id="target-temp">--</span>
                                <button class="temp-btn" id="temp-up" title="Raise target">+</button>
                            </div>
                            <div class="climate-humidity" id="climate-humidity">
                                <i data-lucide="droplets"></i> <span>--</span>
                            </div>
                        </div>
                    </div>
                    <div class="mode-row" id="hvac-modes"></div>
                    <div class="mode-row" id="fan-modes" style="margin-top:4px;"></div>
                </div>
            </div>

            <!-- Battery Card -->
            <div class="dash-card devices-card">
                <div class="card-body">
                    <div class="battery-grid">
                        <div class="battery-item">
                            <div class="batt-top">
                                <span class="batt-device"><i data-lucide="smartphone"></i> Phone</span>
                                <span class="batt-pct" id="phone-pct">--%</span>
                            </div>
                            <div class="battery-bar"><div class="batt-fill" id="phone-bar" style="width:0%;background:var(--mute);"></div></div>
                        </div>
                        <div class="battery-item">
                            <div class="batt-top">
                                <span class="batt-device"><i data-lucide="watch"></i> Watch</span>
                                <span class="batt-pct" id="watch-pct">--%</span>
                            </div>
                            <div class="battery-bar"><div class="batt-fill" id="watch-bar" style="width:0%;background:var(--mute);"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- High Priority Tasks Card -->
            <div class="dash-card tasks-card">
                <div class="card-body tasks-body" id="tasks-list">
                    <div class="tasks-empty">Loading tasks&hellip;</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Calendar Strip -->
    <div class="cal-strip">
        <div class="cal-strip-label"><span class="cal-week-label">This Week</span></div>
        <div class="cal-row" id="cal-row"></div>
    </div>

    <!-- Full-screen calendar overlay: tap the strip to open, tap anywhere to close -->
    <div class="cal-overlay" id="cal-overlay" hidden>
        <div class="cal-ov-week">
            <div class="cal-strip-label"><span class="cal-week-label">This Week</span><span class="cal-ov-updated" id="cal-ov-updated"></span></div>
            <div class="cal-row" id="cal-ov-this"></div>
        </div>
        <div class="cal-ov-week">
            <div class="cal-strip-label"><span class="cal-week-label">Next Week</span></div>
            <div class="cal-row" id="cal-ov-next"></div>
        </div>
    </div>

    <div class="clip-overlay" id="clip-overlay" hidden>
        <div class="clip-box">
            <div class="clip-head"><span id="clip-title"></span><button id="clip-close" title="Close">&times;</button></div>
            <video id="clip-video" controls playsinline muted preload="auto"></video>
        </div>
    </div>
    <div id="night-dim" aria-hidden="true"></div>
    <script src="/static/dashboard.js"></script>
</body>
</html>

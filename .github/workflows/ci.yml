name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      android: ${{ steps.filter.outputs.android }}
      raycast: ${{ steps.filter.outputs.raycast }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - 'examples/**'
              - 'catalog.json'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'server/tests/fixtures/**'
              - '.github/workflows/ci.yml'
            raycast:
              - 'extensions/raycast-assistant/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'server/Dockerfile'
              - 'server/requirements.*'
              - 'server/addons/money_il/worker/**'
              - '.github/workflows/ci.yml'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt
      - run: python bin/test

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The contract tests read the server's fixtures (server/tests/fixtures,
      # a test resources dir of :app); a copy kept under android/ must match.
      - name: Server fixtures are not copied stale
        run: |
          status=0
          while IFS= read -r f; do
            if ! cmp -s "$f" "../server/tests/fixtures/$(basename "$f")"; then
              echo "::error file=android/$f::differs from server/tests/fixtures/$(basename "$f")"; status=1
            fi
          done < <(find . -path '*/build' -prune -o \( -name '*_web.json' -o -name 'golden.sse' \) -type f -print)
          exit $status
      # Unit tests, the phone and watch debug APKs, lint (app: new issues only, over
      # app/lint-baseline.xml), and the kiosk / TV flavors compiled.
      - run: >-
          ./gradlew --no-configuration-cache --continue
          :app:testPhoneDebugUnitTest :wear:testDebugUnitTest :protocol:testDebugUnitTest
          :app:assemblePhoneDebug :wear:assembleDebug
          :app:lintPhoneDebug :wear:lintDebug
          :app:compileKioskDebugKotlin :app:compileTvDebugKotlin

  raycast:
    needs: changes
    if: needs.changes.outputs.raycast == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/raycast-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/raycast-assistant/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx eslint src/

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: server
          target: app
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=min
      - uses: docker/build-push-action@v7
        with:
          context: server/addons/money_il/worker
          push: false
          cache-from: type=gha,scope=money-il-worker
          cache-to: type=gha,scope=money-il-worker,mode=min

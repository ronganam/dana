name: Website

# Publishes website/ to GitHub Pages (Settings → Pages → Source: GitHub Actions). Skipped while the
# repository is private.
on:
  push:
    branches: [master]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as GitHub's own Pages workflow: the artifact is finished before the deploy asks for it
  # (in one job the deploy can miss a just-uploaded artifact). The name carries the attempt, so a
  # re-run never finds the earlier attempt's artifact next to its own.
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

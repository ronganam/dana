# Dana from the published image: the quick start (server/docs/operations.md, "Running it").
#
#   curl -fsSLO https://raw.githubusercontent.com/ronganam/dana/master/compose.yaml
#   docker compose up -d
#   docker compose logs dana       # open the setup link it prints, on this machine
#
# Settings: an optional .env next to this file (server/docs/configuration.md); none are needed to start.
# Upgrading: docker compose pull && docker compose up -d. Building from source instead: server/compose.yaml.
#
# Transcription without an OpenAI or Gemini key (Claude does not hear audio): a local Whisper server,
#   docker compose --profile whisper up -d
# with WHISPER_URL=http://whisper:8000 in .env (server/docs/configuration.md, "Transcription").
# It runs on the CPU; the first transcription downloads the model (WHISPER_MODEL) into its volume.
#
# Everything Dana writes (database, credentials key, recordings, uploads, app updates) lives in the
# `data` volume. Backups (server/docs/backups.md): Settings → Backups makes them on a schedule into
# /backups, the `backups` volume below; to keep them on another disk or a NAS, bind-mount a host
# folder there instead (writable by UID 1001), e.g. `- /mnt/nas/dana-backups:/backups`. Restore:
#   docker compose stop dana
#   docker compose run --rm --no-deps dana dana backups restore /backups/<archive>.tar.gz --yes
#   docker compose start dana
name: dana

services:
  dana:
    image: ghcr.io/ronganam/dana:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/db/db.sqlite3
    ports:
      # Only this machine can reach Dana. To reach it from elsewhere, put it behind a reverse proxy
      # with TLS (Caddy, Traefik, nginx…) on the same host, or a VPN such as Tailscale.
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/app/db
      - backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Optional: speech-to-text on this machine (an OpenAI-compatible /v1/audio/transcriptions).
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: [whisper]
    environment:
      ENABLE_UI: "false"
      LOG_LEVEL: info
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

volumes:
  data:
  backups:
  whisper-models:
